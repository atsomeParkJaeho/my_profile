services:
  - type: web
    name: my_profile
    runtime: node
    plan: free

    buildCommand: |
      cd client && npm ci --include=dev && npm run build &&
      cd ../server && npm ci --include=dev && npm run build

    startCommand: cd server && node dist/main

    envVars:
      - key: NODE_ENV
        value: production

      # ── PostgreSQL (Render DB) 연결 ────────────────────────────
      - key: DB_HOST
        fromDatabase:
          name: my-profile-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: my-profile-db
          property: port

      - key: DB_USER
        fromDatabase:
          name: my-profile-db
          property: user

      - key: DB_PASS
        fromDatabase:
          name: my-profile-db
          property: password

      - key: DB_NAME
        fromDatabase:
          name: my-profile-db
          property: database

      - key: DB_SSL
        value: "true"

      # ── 세션 ──────────────────────────────────────────────────
      - key: SESSION_SECRET
        generateValue: true

      - key: SESSION_DB_PATH
        value: sessions.sqlite

      - key: COOKIE_SECURE
        value: "false"

      # ── 초기 관리자 계정 ──────────────────────────────────────
      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_NAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: my-profile-db
    databaseName: appdb
    plan: free
