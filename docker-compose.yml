services:

  # ── React 클라이언트 (Nginx, 포트 8080) ──────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-server         # Nginx + 클라이언트 빌드 스테이지
    volumes:
      - ./nginx.client.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app
    restart: unless-stopped

  # ── NestJS API 서버 (내부 포트 3000) ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASS: apppass
      DB_NAME: appdb
      SESSION_SECRET: change_this_to_a_strong_random_secret!!
      SESSION_DB_PATH: /app/server/data/sessions.sqlite
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - app-data:/app/server/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # 외부 포트 미노출 — client(Nginx)를 통해서만 접근

  # ── MariaDB ───────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: appdb
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppass
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  mariadb-data:
