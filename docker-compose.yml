services:

  # ── React 클라이언트 (Nginx, 포트 8080) ──────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-server
    volumes:
      - ./nginx.client.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app
    restart: unless-stopped

  # ── NestJS API 서버 (내부 포트 3000) ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASS: apppass
      DB_NAME: appdb
      DB_SSL: "false"
      SESSION_SECRET: change_this_to_a_strong_random_secret!!
      SESSION_DB_PATH: /app/server/data/sessions.sqlite
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - app-data:/app/server/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  postgres-data:
